repos:
  - repo: local
    hooks:
      - id: black
        name: Black Formatter
        entry: uv run black
        language: system
        types: [python]
      - id: ruff
        name: Ruff Linter
        entry: uv run ruff check
        language: system
        types: [python]
      - id: pytest
        name: Pytest
        entry: uv run pytest -q
        language: system
        pass_filenames: false
        stages: [pre-push]
