name: Lint

on:
  push:
    branches: [ "main", "dev", "feat/ci" ]
  pull_request:
    branches: [ "main", "dev", "feat/ci" ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        run: pip install uv

      - name: Create venv and sync dependencies
        run: |
          uv venv
          source .venv/bin/activate
          uv sync --extra dev

      - name: Run Ruff
        run: |
          source .venv/bin/activate
          uv run ruff check .

      - name: Run Black
        run: |
          source .venv/bin/activate
          uv run black --check .
