name: Test

on:
  push:
    branches: [ "main", "dev", "feat/ci" ]
  pull_request:
    branches: [ "main", "dev", "feat/ci" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        run: pip install uv

      - name: Create venv and sync dependencies
        run: |
          uv venv
          source .venv/bin/activate
          uv sync --group dev

      - name: Run tests
        run: |
          source .venv/bin/activate
          uv run pytest -q