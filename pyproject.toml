[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "ip6-automatisierte-sicherheitseval"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "angr>=9.2.203",
    "ipython>=9.11.0",
    "mcp[cli]>=1.26.0",
    "monkeyhex>=1.7.4",
    "pytest>=9.0.2",
    "unicorn>=2.1.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/vuln_validator"]

[dependency-groups]
dev = [
    "black>=26.3.1",
    "pre-commit>=4.5.1",
    "ruff>=0.15.7",
]

[tool.black]
target-version = ["py313"]
